# Publishes to GitHub Pages on every push to main: the Wellperion build at the site root
# and the KSF national build under ksf/ — two separate sites, each with only its own ratings.
# Relative base (./) so the app works under /squash_ratings/; routes are hash-based.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build --mode wellperion --base ./ --outDir dist/site
      - run: npx vite build --base ./ --outDir dist/site/ksf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
